[package]
name = "corekick-core"
version.workspace = true
edition.workspace = true
description = "Platform-independent ride engine, FTMS protocol, routes, workouts, metrics and storage for CoreKick"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"
anyhow = "1"
